const analytics = getAnalytics(app);
// Every visitor is signed in anonymously in the background so Firestore
// rules can require request.auth != null. Drivers/admin never see this —
// it happens before the login screen even renders.
const authReady = new Promise((resolve, reject) => {
  onAuthStateChanged(auth, (user) => {
    if (user) resolve(user);
    else signInAnonymously(auth).catch(reject);
  });
});

/* ---------------------------------- STORAGE ----------------------------------
   Same shape/behavior as the original window.storage-based functions, now
   backed by Firestore. Single shared doc for the fleet dataset, one for
   the admin passcode — mirrors the original "one shared store" model.
----------------------------------------------------------------------------- */
const FS_COLLECTION = 'urbanFleetX';
const FS_DATA_DOC = 'appData';
const FS_CONFIG_DOC = 'config';

const emptyData = {
  vehicles: [], drivers: [], payments: [], maintenance: [],
  inspections: [], fuelLogs: [], incidents: [], cleaning: [],
};

async function loadData() {
  try {
    await authReady;
    const snap = await getDoc(doc(db, FS_COLLECTION, FS_DATA_DOC));
    if (snap.exists()) return { ...emptyData, ...snap.data() };
  } catch (e) { console.error('loadData failed:', e); }
  return emptyData;
}

async function saveData(data) {
  try {
    await authReady;
    await setDoc(doc(db, FS_COLLECTION, FS_DATA_DOC), data);
  } catch (e) { console.error('saveData failed:', e); }
}

async function fbLoadAdminPasscode(defaultPasscode) {
  try {
    await authReady;
    const snap = await getDoc(doc(db, FS_COLLECTION, FS_CONFIG_DOC));
    if (snap.exists() && snap.data().adminPasscode) return snap.data().adminPasscode;
  } catch (e) { console.error('loadAdminPasscode failed:', e); }
  return defaultPasscode;
}

async function fbSaveAdminPasscode(pin) {
  try {
    await authReady;
    await setDoc(doc(db, FS_COLLECTION, FS_CONFIG_DOC), { adminPasscode: pin }, { merge: true });
  } catch (e) { console.error('saveAdminPasscode failed:', e); }
}

function uid(p) { return p + '_' + Math.random().toString(36).slice(2, 10); }
function today() { return new Date().toISOString().slice(0, 10); }
function fmtR(n) { return 'R' + (Number(n) || 0).toLocaleString('en-ZA', { maximumFractionDigits: 2 }); }
function fmtDateTime(iso) { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('en-ZA') + ' ' + d.toLocaleTimeString('en-ZA', { hour: '2-digit', minute: '2-digit' }); }
function isoWeekStart(d = new Date()) {
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = dt.getDate() - day + (day === 0 ? -6 : 1);
  const monday = new Date(dt.setDate(diff));
  monday.setHours(0, 0, 0, 0);
  return monday.toISOString().slice(0, 10);
}
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const d = new Date(dateStr);
  return Math.round((d - now) / 86400000);
}
function daysSince(dateStr) {
  if (!dateStr) return null;
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const d = new Date(dateStr);
  return Math.round((now - d) / 86400000);
}
function isWeekend() {
  const day = new Date().getDay();
  return day === 0 || day === 5 || day === 6;
}

function downloadWorkbook(wb, filename) {
  const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([wbout], { type: 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
}
function exportAllToExcel(data) {
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data.vehicles.map(v => {
    const driver = data.drivers.find(d => d.id === v.driverId);
    return { Plate: v.plate, Model: v.model, Driver: driver ? driver.name : '', Status: v.status, 'Weekly Fee (R)': v.weeklyFee || WEEKLY_FEE_DEFAULT, 'Insurance Expiry': v.insuranceExpiry || '', 'Licence Expiry': v.licenseExpiry || '' };
  })), 'Vehicles');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data.drivers.map(d => {
    const vehicle = data.vehicles.find(v => v.id === d.vehicleId);
    return { Name: d.name, Username: d.username, Phone: d.phone, Vehicle: vehicle ? vehicle.plate : '', Status: d.status || 'active' };
  })), 'Drivers');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data.payments.map(p => {
    const vehicle = data.vehicles.find(v => v.id === p.vehicleId);
    return { 'Week Starting': p.weekStarting, Vehicle: vehicle ? vehicle.plate : p.vehicleId, 'Amount Due (R)': p.amountDue, 'Amount Paid (R)': p.amountPaid, Status: p.status };
  })), 'Weekly Fee History');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data.maintenance.map(m => {
    const vehicle = data.vehicles.find(v => v.id === m.vehicleId);
    return { Date: m.date, Vehicle: vehicle ? vehicle.plate : m.vehicleId, Type: m.type, 'Cost (R)': m.cost, Notes: m.notes || '' };
  })), 'Maintenance');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data.incidents.map(i => {
    const vehicle = data.vehicles.find(v => v.id === i.vehicleId);
    const driver = data.drivers.find(d => d.id === i.driverId);
    return {
      Date: i.date, Vehicle: vehicle ? vehicle.plate : '', 'Reported By': driver ? driver.name : '', Type: i.type,
      'Caused By': i.causedBy === 'driver' ? 'Driver' : 'Other Party', 'Other Party Name': i.otherParty?.name || '',
      'Other Party ID': i.otherParty?.idNumber || '', 'Other Party Phone': i.otherParty?.phone || '',
      Description: i.description, 'Police Case No.': i.policeCaseNumber || '',
    };
  })), 'Incidents & Damage');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data.cleaning.map(c => {
    const vehicle = data.vehicles.find(v => v.id === c.vehicleId);
    return { Date: c.date, Vehicle: vehicle ? vehicle.plate : '', 'Exterior Washed': c.exteriorWashed ? 'Yes' : 'No', 'Windows Wiped': c.windowsWiped ? 'Yes' : 'No', 'Full Clean': c.fullClean ? 'Yes' : 'No' };
  })), 'Cleaning Log');
  downloadWorkbook(wb, `Urban_Fleet_X_Data_Export_${today()}.xlsx`);
}
function exportWeekToExcel(weekPayments, vehicles, drivers, weekLabel) {
  const rows = weekPayments.map(p => {
    const vehicle = vehicles.find(v => v.id === p.vehicleId);
    const driver = drivers.find(d => d.id === vehicle?.driverId);
    return { Vehicle: vehicle ? vehicle.plate : '', Driver: driver ? driver.name : '', 'Amount Due (R)': p.amountDue, 'Amount Paid (R)': p.amountPaid, Status: p.status, 'Date Paid': p.datePaid || '' };
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Weekly Fees');
  downloadWorkbook(wb, `Urban_Fleet_X_Weekly_Fees_${weekLabel}.xlsx`);
}

/* ---------------------------------- UI PRIMITIVES (dark) ---------------------------------- */
function Badge({ tone = 'neutral', children }) {
  const tones = {
    good: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30',
    warn: 'bg-amber-500/10 text-amber-400 border-amber-500/30',
    bad: 'bg-red-500/10 text-red-400 border-red-500/30',
    neutral: 'bg-white/5 text-[#93A9BE] border-white/10',
  };
  return <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] font-mono font-medium border ${tones[tone]}`}>{children}</span>;
}
function StatCard({ label, value, sub, icon: Icon, tone }) {
  const toneColor = tone === 'bad' ? 'text-red-400' : tone === 'warn' ? 'text-amber-400' : tone === 'good' ? 'text-emerald-400' : 'text-[#F1F5F9]';
  return (
    <div className="rounded-md p-4 border" style={{ background: CARD, borderColor: BORDER }}>
      <div className="flex items-center justify-between mb-2">
        <span className="text-[11px] font-mono uppercase tracking-wider" style={{ color: TEXT_FAINT }}>{label}</span>
        {Icon && <Icon size={15} style={{ color: TEXT_FAINT }} />}
      </div>
      <div className={`text-2xl font-semibold font-mono ${toneColor}`}>{value}</div>
      {sub && <div className="text-xs mt-1" style={{ color: TEXT_DIM }}>{sub}</div>}
    </div>
  );
}
function Modal({ title, onClose, children, wide }) {
  return (
    <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" onClick={onClose}>
      <div className={`rounded-md w-full ${wide ? 'max-w-2xl' : 'max-w-lg'} max-h-[85vh] overflow-y-auto border`} style={{ background: CARD, borderColor: BORDER }} onClick={e => e.stopPropagation()}>

        </div>
        <div className="p-5">{children}</div>
      </div>

}
function Field({ label, children }) {

function TopBar({ title, onBack, right }) {

const globalFontStyle = `@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

/* =========================================================================
   ROOT APP
========================================================================= */
function App() {
  const [data, setData] = useState(emptyData);
  const [loading, setLoading] = useState(true);
  const [session, setSession] = useState(null);
  const [adminPasscode, setAdminPasscode] = useState(DEFAULT_ADMIN_PASSCODE);
  const [gate, setGate] = useState(null);

  useEffect(() => {
    (async () => {
      const [d, pin] = await Promise.all([loadData(), loadAdminPasscode()]);
      setData(d); setAdminPasscode(pin); setLoading(false);
    })();
  }, []);

  const persist = useCallback((updater) => {
    setData(prev => { const next = updater(prev); saveData(next); return next; });
  }, []);

  if (loading) return <div className="min-h-screen flex items-center justify-center" style={{ background: BG }}><Loader2 className="animate-spin" style={{ color: TEXT_FAINT }} size={26} /></div>;

  if (!session) {
    if (gate === 'driver') return <DriverLogin drivers={data.drivers} onSuccess={(driverId) => setSession({ role: 'driver', driverId })} onCancel={() => setGate(null)} />;
    if (gate === 'admin') return <AdminGate passcode={adminPasscode} onSetPasscode={(p) => { setAdminPasscode(p); saveAdminPasscode(p); }} onSuccess={() => setSession({ role: 'admin' })} onCancel={() => setGate(null)} />;
    return <RoleSelect onSelect={setGate} />;
  }

  if (session.role === 'driver') return <DriverApp data={data} persist={persist} driverId={session.driverId} onExit={() => { setSession(null); setGate(null); }} />;
  if (session.role === 'admin') return <AdminApp data={data} persist={persist} onExit={() => { setSession(null); setGate(null); }} />;
  return null;
}

          <div className="flex-1"><div className="font-semibold" style={{ color: TEXT }}>Admin Login</div><div className="text-xs mt-0.5" style={{ color: TEXT_DIM }}>Full fleet operations dashboard</div></div>

function DriverLogin({ drivers, onSuccess, onCancel }) {
  const [selectedId, setSelectedId] = useState('');
  const [pin, setPin] = useState('');
  const [err, setErr] = useState('');

  function submit() {
    const driver = drivers.find(d => d.id === selectedId);
    if (!driver) { setErr('Select your name'); return; }
    if (!driver.pin) { onSuccess(driver.id); return; }
    if (pin === driver.pin) onSuccess(driver.id);
    else setErr('Incorrect PIN');
  }

  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6" style={{ background: BG, fontFamily: "'IBM Plex Sans', system-ui, sans-serif" }}>
      <style>{globalFontStyle}</style>
      <img src={`data:image/png;base64,${LOGO_COMPACT_B64}`} alt="Urban Fleet X" className="w-40 mb-8" />
      <div className="font-semibold mb-1" style={{ color: TEXT }}>Driver Login</div>
      <div className="text-xs mb-6" style={{ color: TEXT_DIM }}>Select your name and enter your PIN</div>
      <div className="w-full max-w-xs space-y-3">
        {drivers.length === 0 && <div className="text-center text-sm rounded-xl p-6 border border-dashed" style={{ color: TEXT_DIM, borderColor: BORDER }}>No driver accounts yet. Ask your Admin to create one for you.</div>}
        {drivers.length > 0 && (
          <>
            <select value={selectedId} onChange={e => { setSelectedId(e.target.value); setErr(''); }} className={inputClsLg} style={inputStyle}>
              <option value="">Select your name…</option>
              {drivers.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
            </select>
            <input type="password" inputMode="numeric" value={pin} onChange={e => { setPin(e.target.value); setErr(''); }} onKeyDown={e => e.key === 'Enter' && submit()}
              className={`${inputClsLg} text-center tracking-[0.3em] font-mono`} style={inputStyle} placeholder="PIN" />
            {err && <div className="text-xs text-red-400 text-center">{err}</div>}
            <button onClick={submit} disabled={!selectedId} className={btnPrimary} style={{ background: STEEL }}>Log In</button>
          </>
        )}
        <button onClick={onCancel} className="w-full py-2.5 text-sm" style={{ color: TEXT_FAINT }}>← Back</button>
      </div>
    </div>
  );
}

function AdminGate({ passcode, onSetPasscode, onSuccess, onCancel }) {
  const [pin, setPin] = useState('');
  const [err, setErr] = useState(false);
  const [changing, setChanging] = useState(false);
  const [newPin, setNewPin] = useState('');

  function submit() {
    if (pin === passcode) onSuccess();
    else { setErr(true); setTimeout(() => setErr(false), 1200); }
  }

  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6" style={{ background: BG, fontFamily: "'IBM Plex Sans', system-ui, sans-serif" }}>
      <style>{globalFontStyle}</style>
      <img src={`data:image/png;base64,${LOGO_COMPACT_B64}`} alt="Urban Fleet X" className="w-40 mb-8" />
      <div className="w-11 h-11 rounded-xl flex items-center justify-center mb-4" style={{ background: 'rgba(91,155,224,0.12)' }}><Lock size={20} color={SIGNAL} /></div>
      <div className="font-semibold mb-1" style={{ color: TEXT }}>Admin Access</div>
      <div className="text-xs mb-6" style={{ color: TEXT_DIM }}>Enter the admin passcode to continue</div>
      <div className="w-full max-w-xs">
        <input type="password" inputMode="numeric" value={pin} onChange={e => setPin(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()}
          className={`${inputClsLg} text-center tracking-[0.3em] font-mono ${err ? 'border-red-400 animate-pulse' : ''}`} style={inputStyle} placeholder="••••" autoFocus />
        <button onClick={submit} className={btnPrimary} style={{ background: STEEL, marginTop: 14 }}>Enter Dashboard</button>
        <button onClick={onCancel} className="w-full py-3 text-sm mt-1" style={{ color: TEXT_FAINT }}>← Back</button>
        <div className="mt-8 pt-6 border-t" style={{ borderColor: BORDER }}>
          {!changing ? (
            <button onClick={() => setChanging(true)} className="text-xs underline" style={{ color: TEXT_FAINT }}>Change passcode</button>
          ) : (
            <div className="space-y-2">
              <p className="text-xs" style={{ color: TEXT_FAINT }}>Set a new admin passcode:</p>
              <input value={newPin} onChange={e => setNewPin(e.target.value)} className={inputClsLg + ' text-center font-mono'} style={inputStyle} placeholder="New passcode" />
              <button onClick={() => { if (newPin) { onSetPasscode(newPin); setChanging(false); setNewPin(''); } }} className="w-full py-2.5 rounded-lg text-white text-sm font-medium" style={{ background: NAVY_DEEP_BTN }}>Save New Passcode</button>
            </div>
          )}
        </div>
        <p className="text-[10px] mt-6 text-center" style={{ color: TEXT_FAINT }}>This is a basic access code for internal convenience, not enterprise-grade security.</p>
      </div>
    </div>
  );
}

/* =========================================================================
   DRIVER APP
========================================================================= */
function DriverApp({ data, persist, driverId, onExit }) {
  const [screen, setScreen] = useState('menu'); // menu | inspection | fuel | cleaning | incident | history
  const driver = data.drivers.find(d => d.id === driverId);
  const vehicle = data.vehicles.find(v => v.id === driver?.vehicleId);

  const lastFullClean = useMemo(() => {
    const logs = data.cleaning.filter(c => c.vehicleId === vehicle?.id && c.fullClean).sort((a, b) => b.submittedAt.localeCompare(a.submittedAt));
    return logs[0]?.date || null;
  }, [data.cleaning, vehicle]);
  const cleanDue = lastFullClean === null || daysSince(lastFullClean) >= CLEAN_INTERVAL_DAYS;

  if (!driver) return <div className="min-h-screen flex items-center justify-center" style={{ background: BG, color: TEXT_DIM }}>Driver not found. <button onClick={onExit} className="underline ml-2">Back</button></div>;

  return (
    <div className="min-h-screen pb-10" style={{ background: BG, fontFamily: "'IBM Plex Sans', system-ui, sans-serif" }}>
      <style>{globalFontStyle}</style>

      {screen === 'menu' && (
        <>
          <TopBar title={`Hi, ${driver.name.split(' ')[0]}`} right={<button onClick={onExit} style={{ color: TEXT_FAINT }}><LogOut size={18} /></button>} />
          <div className="px-4 py-5 max-w-md mx-auto">
            <div className="rounded-xl p-4 mb-6 flex items-center gap-3 border" style={{ background: CARD, borderColor: BORDER }}>
              <div className="w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0" style={{ background: 'rgba(91,155,224,0.12)' }}><Truck size={18} color={SIGNAL} /></div>
              <div>
                <div className="text-sm font-semibold" style={{ color: TEXT }}>{vehicle ? vehicle.plate : 'No vehicle assigned'}</div>
                <div className="text-xs" style={{ color: TEXT_DIM }}>{vehicle ? vehicle.model : 'Contact your Fleet Coordinator'}</div>
              </div>
            </div>

            {vehicle && cleanDue && (
              <div className="rounded-xl p-3.5 mb-4 flex items-center gap-2.5 border" style={{ background: 'rgba(245,158,11,0.08)', borderColor: 'rgba(245,158,11,0.3)' }}>
                <Sparkles size={16} className="text-amber-400 flex-shrink-0" />
                <span className="text-xs text-amber-300">{lastFullClean ? `Full clean overdue — last done ${daysSince(lastFullClean)}d ago` : 'No full clean logged yet'}. Required every {CLEAN_INTERVAL_DAYS} days.</span>
              </div>
            )}

            <div className="space-y-3">
              <MenuCard icon={ClipboardCheck} label="New Inspection" sub="Weekly vehicle checklist" onClick={() => setScreen('inspection')} disabled={!vehicle} />
              <MenuCard icon={Sparkles} label="Log Cleaning" sub="Exterior wash, windows, full clean" onClick={() => setScreen('cleaning')} disabled={!vehicle} />
              <MenuCard icon={Fuel} label="Log Fuel" sub="Record a refuel" onClick={() => setScreen('fuel')} disabled={!vehicle} />
              <MenuCard icon={FileWarning} label="Report Incident / Damage" sub="Accident, damage, loss" onClick={() => setScreen('incident')} disabled={!vehicle} />
              <MenuCard icon={Clock} label="My History" sub="Everything you've submitted" onClick={() => setScreen('history')} />
            </div>
          </div>
        </>
      )}

      {screen === 'inspection' && vehicle && <InspectionForm vehicle={vehicle} driver={driver} persist={persist} onDone={() => setScreen('menu')} onBack={() => setScreen('menu')} />}
      {screen === 'cleaning' && vehicle && <CleaningForm vehicle={vehicle} driver={driver} persist={persist} onDone={() => setScreen('menu')} onBack={() => setScreen('menu')} />}
      {screen === 'fuel' && vehicle && <FuelForm vehicle={vehicle} driver={driver} persist={persist} onDone={() => setScreen('menu')} onBack={() => setScreen('menu')} />}
      {screen === 'incident' && vehicle && <IncidentForm vehicle={vehicle} driver={driver} persist={persist} onDone={() => setScreen('menu')} onBack={() => setScreen('menu')} />}
      {screen === 'history' && <DriverHistory data={data} driver={driver} onBack={() => setScreen('menu')} />}
    </div>
  );
}

function MenuCard({ icon: Icon, label, sub, onClick, disabled }) {
  return (

      <div className="w-11 h-11 rounded-lg flex items-center justify-center flex-shrink-0" style={{ background: 'rgba(91,155,224,0.1)' }}><Icon size={19} color={SIGNAL} /></div>

        <div className="font-semibold text-sm" style={{ color: TEXT }}>{label}</div>

      <ChevronRight size={18} style={{ color: TEXT_FAINT }} />

}

/* ---------------------------------- INSPECTION FORM ---------------------------------- */
function InspectionForm({ vehicle, driver, persist, onDone, onBack }) {
  const [answers, setAnswers] = useState({});
  const [notes, setNotes] = useState({});
  const [odometer, setOdometer] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const [done, setDone] = useState(false);

  function setAns(key, val) { setAnswers(prev => ({ ...prev, [key]: val })); }
  const totalItems = CHECKLIST_SECTIONS.reduce((s, sec) => s + sec.items.length, 0);
  const answeredCount = Object.keys(answers).length;
  const flaggedKeys = Object.entries(answers).filter(([, v]) => v === 'flag').map(([k]) => k);

  function submit() {
    setSubmitting(true);
    const record = { id: uid('insp'), vehicleId: vehicle.id, driverId: driver.id, date: today(), submittedAt: new Date().toISOString(), odometer: odometer || null, answers, notes, flaggedCount: flaggedKeys.length, outcome: flaggedKeys.length === 0 ? 'pass' : 'flagged' };
    persist(prev => ({ ...prev, inspections: [...prev.inspections, record] }));
    setSubmitting(false); setDone(true);
  }

  if (done) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center px-6 text-center" style={{ background: BG }}>
        <div className="w-16 h-16 rounded-full flex items-center justify-center mb-4" style={{ background: flaggedKeys.length ? 'rgba(245,158,11,0.12)' : 'rgba(16,185,129,0.12)' }}>
          {flaggedKeys.length ? <AlertTriangle size={28} className="text-amber-400" /> : <Check size={28} className="text-emerald-400" />}
        </div>
        <div className="font-semibold text-lg mb-1" style={{ color: TEXT }}>Inspection Submitted</div>
        <div className="text-sm mb-6" style={{ color: TEXT_DIM }}>{flaggedKeys.length ? `${flaggedKeys.length} item(s) flagged — visible on the Admin dashboard.` : 'All items passed. Vehicle cleared for the week.'}</div>
        <button onClick={onDone} className={btnPrimary} style={{ background: STEEL, maxWidth: 260 }}>Done</button>
      </div>
    );
  }

  return (
    <div className="min-h-screen pb-28" style={{ background: BG }}>
      <TopBar title="Weekly Inspection" onBack={onBack} right={<span className="text-xs font-mono" style={{ color: TEXT_FAINT }}>{answeredCount}/{totalItems}</span>} />
      <div className="px-4 py-4 max-w-md mx-auto">
        <div className="rounded-xl p-4 mb-4 border" style={{ background: CARD, borderColor: BORDER }}>
          <div className="text-sm font-semibold" style={{ color: TEXT }}>{vehicle.plate} — {vehicle.model}</div>
          <div className="text-xs mt-0.5" style={{ color: TEXT_DIM }}>{today()}</div>
          <input className={inputCls + ' mt-3'} style={inputStyle} placeholder="Odometer reading (km)" inputMode="numeric" value={odometer} onChange={e => setOdometer(e.target.value)} />
        </div>

        {CHECKLIST_SECTIONS.map(sec => (
          <div key={sec.key} className="rounded-xl mb-3 overflow-hidden border" style={{ background: CARD, borderColor: BORDER }}>
            <div className="px-4 py-2.5 text-xs font-mono uppercase tracking-wide border-b" style={{ background: CARD_ALT, borderColor: BORDER, color: TEXT_DIM }}>{sec.label}</div>
            <div className="divide-y" style={{ borderColor: BORDER }}>
              {sec.items.map((item, i) => {
                const key = sec.key + '_' + i;
                const val = answers[key];
                return (
                  <div key={key} className="px-4 py-3" style={{ borderColor: BORDER }}>
                    <div className="flex items-center justify-between gap-3">
                      <span className="text-sm flex-1" style={{ color: TEXT }}>{item}</span>
                      <div className="flex gap-1.5 flex-shrink-0">
                        <button onClick={() => setAns(key, 'pass')} className="w-9 h-9 rounded-lg flex items-center justify-center border" style={val === 'pass' ? { background: '#10B981', borderColor: '#10B981', color: '#fff' } : { borderColor: BORDER, color: TEXT_FAINT }}><Check size={16} /></button>
                        <button onClick={() => setAns(key, 'flag')} className="w-9 h-9 rounded-lg flex items-center justify-center border" style={val === 'flag' ? { background: '#EF4444', borderColor: '#EF4444', color: '#fff' } : { borderColor: BORDER, color: TEXT_FAINT }}><X size={16} /></button>
                      </div>
                    </div>
                    {val === 'flag' && (
                      <input className={inputCls + ' mt-2 text-sm py-2'} style={inputStyle} placeholder="Describe the issue…" value={notes[key] || ''} onChange={e => setNotes(prev => ({ ...prev, [key]: e.target.value }))} />
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>
      <div className="fixed bottom-0 left-0 right-0 border-t p-4" style={{ background: CARD_ALT, borderColor: BORDER }}>
        <div className="max-w-md mx-auto">
          <button onClick={submit} disabled={answeredCount < totalItems || submitting} className={btnPrimary} style={{ background: answeredCount < totalItems ? '#3A5068' : STEEL }}>
            {submitting ? <Loader2 size={18} className="animate-spin" /> : <>Submit Inspection {flaggedKeys.length > 0 && `(${flaggedKeys.length} flagged)`}</>}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------- CLEANING FORM ---------------------------------- */
function CleaningForm({ vehicle, driver, persist, onDone, onBack }) {
  const [exteriorWashed, setExteriorWashed] = useState(false);
  const [windowsWiped, setWindowsWiped] = useState(false);
  const [fullClean, setFullClean] = useState(false);
  const [notes, setNotes] = useState('');
  const [done, setDone] = useState(false);

  function submit() {
    const record = { id: uid('clean'), vehicleId: vehicle.id, driverId: driver.id, date: today(), submittedAt: new Date().toISOString(), exteriorWashed, windowsWiped, fullClean, notes };
    persist(prev => ({ ...prev, cleaning: [...prev.cleaning, record] }));
    setDone(true);
  }

  if (done) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center px-6 text-center" style={{ background: BG }}>
        <div className="w-16 h-16 rounded-full flex items-center justify-center mb-4" style={{ background: 'rgba(16,185,129,0.12)' }}><Check size={28} className="text-emerald-400" /></div>
        <div className="font-semibold text-lg mb-1" style={{ color: TEXT }}>Cleaning Logged</div>
        <div className="text-sm mb-6" style={{ color: TEXT_DIM }}>Recorded against {vehicle.plate}.</div>
        <button onClick={onDone} className={btnPrimary} style={{ background: STEEL, maxWidth: 260 }}>Done</button>
      </div>
    );
  }

  const Toggle = ({ checked, onChange, label, sub }) => (
    <button onClick={() => onChange(!checked)} className="w-full rounded-xl p-4 flex items-center gap-3.5 border text-left" style={{ background: CARD, borderColor: checked ? SIGNAL : BORDER }}>
      <div className="w-6 h-6 rounded-md flex items-center justify-center flex-shrink-0 border-2" style={checked ? { background: SIGNAL, borderColor: SIGNAL } : { borderColor: BORDER }}>
        {checked && <Check size={14} color="#fff" />}
      </div>
      <div className="flex-1">
        <div className="text-sm font-medium" style={{ color: TEXT }}>{label}</div>
        {sub && <div className="text-xs mt-0.5" style={{ color: TEXT_DIM }}>{sub}</div>}
      </div>
    </button>
  );

  return (
    <div className="min-h-screen" style={{ background: BG }}>
      <TopBar title="Log Cleaning" onBack={onBack} />
      <div className="px-4 py-5 max-w-md mx-auto space-y-3">
        <div className="rounded-xl p-4 mb-2 border" style={{ background: CARD, borderColor: BORDER }}>
          <div className="text-sm font-semibold" style={{ color: TEXT }}>{vehicle.plate} — {vehicle.model}</div>
          <div className="text-xs mt-0.5" style={{ color: TEXT_DIM }}>Full clean required every {CLEAN_INTERVAL_DAYS} days, or sooner if the vehicle is visibly dirty.</div>
        </div>
        <Toggle checked={exteriorWashed} onChange={setExteriorWashed} label="Exterior washed" />
        <Toggle checked={windowsWiped} onChange={setWindowsWiped} label="All windows wiped" />
        <Toggle checked={fullClean} onChange={setFullClean} label="Full clean completed" sub="Interior + exterior, deep clean" />
        <textarea className={inputCls + ' mt-1'} style={inputStyle} rows={2} placeholder="Notes (optional)" value={notes} onChange={e => setNotes(e.target.value)} />
        <button onClick={submit} disabled={!exteriorWashed && !windowsWiped && !fullClean} className={btnPrimary} style={{ background: STEEL, marginTop: 8 }}>Save Cleaning Log</button>
      </div>
    </div>
  );
}

/* ---------------------------------- FUEL FORM ---------------------------------- */
function FuelForm({ vehicle, driver, persist, onDone, onBack }) {
  const [liters, setLiters] = useState('');
  const [pricePerLiter, setPricePerLiter] = useState('');
  const [odometer, setOdometer] = useState('');
  const [done, setDone] = useState(false);
  const total = (Number(liters) || 0) * (Number(pricePerLiter) || 0);

  function submit() {
    const record = { id: uid('fuel'), vehicleId: vehicle.id, driverId: driver.id, date: today(), submittedAt: new Date().toISOString(), liters: Number(liters), pricePerLiter: Number(pricePerLiter), total, odometer: odometer || null };
    persist(prev => ({ ...prev, fuelLogs: [...prev.fuelLogs, record] }));
    setDone(true);
  }

  if (done) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center px-6 text-center" style={{ background: BG }}>
        <div className="w-16 h-16 rounded-full flex items-center justify-center mb-4" style={{ background: 'rgba(16,185,129,0.12)' }}><Check size={28} className="text-emerald-400" /></div>
        <div className="font-semibold text-lg mb-1" style={{ color: TEXT }}>Fuel Logged</div>
        <div className="text-sm mb-6" style={{ color: TEXT_DIM }}>{liters} L for {fmtR(total)} recorded against {vehicle.plate}.</div>
        <button onClick={onDone} className={btnPrimary} style={{ background: STEEL, maxWidth: 260 }}>Done</button>
      </div>
    );
  }

  return (
    <div className="min-h-screen" style={{ background: BG }}>
      <TopBar title="Log Fuel" onBack={onBack} />
      <div className="px-4 py-5 max-w-md mx-auto">
        <div className="rounded-xl p-4 mb-5 border" style={{ background: CARD, borderColor: BORDER }}>
          <div className="text-sm font-semibold" style={{ color: TEXT }}>{vehicle.plate} — {vehicle.model}</div>
          <div className="text-xs mt-0.5" style={{ color: TEXT_DIM }}>Fuel is driver-funded per your Driver Agreement — this log is for fleet fuel-efficiency tracking only.</div>
        </div>
        <div className="space-y-3">
          <div>
            <label className="text-xs font-medium mb-1 block" style={{ color: TEXT_DIM }}>Litres Filled</label>
            <div className="relative"><Droplet size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2" style={{ color: TEXT_FAINT }} /><input className={inputCls + ' pl-10'} style={inputStyle} inputMode="decimal" placeholder="e.g. 35.5" value={liters} onChange={e => setLiters(e.target.value)} /></div>
          </div>
          <div>
            <label className="text-xs font-medium mb-1 block" style={{ color: TEXT_DIM }}>Price per Litre (R)</label>
            <input className={inputCls} style={inputStyle} inputMode="decimal" placeholder="e.g. 23.50" value={pricePerLiter} onChange={e => setPricePerLiter(e.target.value)} />
          </div>
          <div>
            <label className="text-xs font-medium mb-1 block" style={{ color: TEXT_DIM }}>Odometer Reading (km) — optional</label>
            <div className="relative"><Gauge size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2" style={{ color: TEXT_FAINT }} /><input className={inputCls + ' pl-10'} style={inputStyle} inputMode="numeric" value={odometer} onChange={e => setOdometer(e.target.value)} /></div>
          </div>
          <div className="rounded-xl p-4 flex items-center justify-between border" style={{ background: CARD_ALT, borderColor: BORDER }}>
            <span className="text-sm" style={{ color: TEXT_DIM }}>Total Cost</span>
            <span className="font-mono font-semibold text-lg" style={{ color: TEXT }}>{fmtR(total)}</span>
          </div>
          <button onClick={submit} disabled={!liters || !pricePerLiter} className={btnPrimary} style={{ background: (!liters || !pricePerLiter) ? '#3A5068' : STEEL, marginTop: 8 }}>Save Fuel Entry</button>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------- INCIDENT / DAMAGE FORM ---------------------------------- */
function IncidentForm({ vehicle, driver, persist, onDone, onBack }) {
  const [type, setType] = useState('');
  const [description, setDescription] = useState('');
  const [causedBy, setCausedBy] = useState(''); // 'driver' | 'other'
  const [otherParty, setOtherParty] = useState({ name: '', idNumber: '', phone: '', address: '', vehicleReg: '', insurer: '' });
  const [policeCaseNumber, setPoliceCaseNumber] = useState('');
  const [done, setDone] = useState(false);

  const canSubmit = type && description && causedBy && (causedBy === 'driver' || otherParty.name);

  function submit() {
    const record = {
      id: uid('inc'), vehicleId: vehicle.id, driverId: driver.id, date: today(), submittedAt: new Date().toISOString(),
      type, description, causedBy, otherParty: causedBy === 'other' ? otherParty : null, policeCaseNumber: policeCaseNumber || null,
    };
    persist(prev => ({ ...prev, incidents: [...prev.incidents, record] }));
    setDone(true);
  }

  if (done) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center px-6 text-center" style={{ background: BG }}>
        <div className="w-16 h-16 rounded-full flex items-center justify-center mb-4" style={{ background: 'rgba(239,68,68,0.12)' }}><FileWarning size={28} className="text-red-400" /></div>
        <div className="font-semibold text-lg mb-1" style={{ color: TEXT }}>Report Submitted</div>
        <div className="text-sm mb-6" style={{ color: TEXT_DIM }}>The Admin has been notified and can see full details on the dashboard.</div>
        <button onClick={onDone} className={btnPrimary} style={{ background: STEEL, maxWidth: 260 }}>Done</button>
      </div>
    );
  }

  return (
    <div className="min-h-screen pb-6" style={{ background: BG }}>
      <TopBar title="Report Incident / Damage" onBack={onBack} />
      <div className="px-4 py-5 max-w-md mx-auto space-y-4">
        <div className="rounded-xl p-3.5 border" style={{ background: 'rgba(239,68,68,0.08)', borderColor: 'rgba(239,68,68,0.3)' }}>
          <span className="text-xs text-red-300">If anyone is injured, call 10111 (Police) or 112 first. This form is for record-keeping, not emergency response.</span>
        </div>

        <Field label="Type of Incident">
          <select className={inputCls} style={inputStyle} value={type} onChange={e => setType(e.target.value)}>
            <option value="">Select…</option>
            {INCIDENT_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
          </select>
        </Field>
        <Field label="What Happened">
          <textarea className={inputCls} style={inputStyle} rows={3} value={description} onChange={e => setDescription(e.target.value)} placeholder="Describe the incident…" />
        </Field>

        <div>
          <span className="block text-xs font-medium mb-2" style={{ color: TEXT_DIM }}>Who caused this?</span>
          <div className="grid grid-cols-2 gap-2">
            <button onClick={() => setCausedBy('driver')} className="py-3 rounded-lg border text-sm font-medium" style={causedBy === 'driver' ? { background: STEEL, borderColor: STEEL, color: '#fff' } : { borderColor: BORDER, color: TEXT_DIM }}>I caused it</button>
            <button onClick={() => setCausedBy('other')} className="py-3 rounded-lg border text-sm font-medium" style={causedBy === 'other' ? { background: STEEL, borderColor: STEEL, color: '#fff' } : { borderColor: BORDER, color: TEXT_DIM }}>Someone else</button>
          </div>
        </div>

        {causedBy === 'other' && (
          <div className="rounded-xl p-4 border space-y-3" style={{ background: CARD, borderColor: BORDER }}>
            <div className="text-xs font-mono uppercase tracking-wide" style={{ color: TEXT_FAINT }}>Other Party's Full Details</div>
            <Field label="Full Name *"><input className={inputCls} style={inputStyle} value={otherParty.name} onChange={e => setOtherParty({ ...otherParty, name: e.target.value })} /></Field>
            <Field label="ID Number"><input className={inputCls} style={inputStyle} value={otherParty.idNumber} onChange={e => setOtherParty({ ...otherParty, idNumber: e.target.value })} /></Field>
            <Field label="Phone Number"><input className={inputCls} style={inputStyle} value={otherParty.phone} onChange={e => setOtherParty({ ...otherParty, phone: e.target.value })} /></Field>
            <Field label="Address"><input className={inputCls} style={inputStyle} value={otherParty.address} onChange={e => setOtherParty({ ...otherParty, address: e.target.value })} /></Field>
            <Field label="Their Vehicle Registration (if applicable)"><input className={inputCls} style={inputStyle} value={otherParty.vehicleReg} onChange={e => setOtherParty({ ...otherParty, vehicleReg: e.target.value })} /></Field>
            <Field label="Their Insurer (if known)"><input className={inputCls} style={inputStyle} value={otherParty.insurer} onChange={e => setOtherParty({ ...otherParty, insurer: e.target.value })} /></Field>
          </div>
        )}

        <Field label="Police Case Number (if applicable)"><input className={inputCls} style={inputStyle} value={policeCaseNumber} onChange={e => setPoliceCaseNumber(e.target.value)} /></Field>

        <button onClick={submit} disabled={!canSubmit} className={btnPrimary} style={{ background: !canSubmit ? '#3A5068' : '#DC2626' }}>Submit Report</button>
      </div>
    </div>
  );
}

/* ---------------------------------- DRIVER HISTORY ---------------------------------- */
function DriverHistory({ data, driver, onBack }) {
  const [tab, setTab] = useState('inspections');
  const myInspections = data.inspections.filter(i => i.driverId === driver.id).sort((a, b) => b.submittedAt.localeCompare(a.submittedAt));
  const myFuel = data.fuelLogs.filter(f => f.driverId === driver.id).sort((a, b) => b.submittedAt.localeCompare(a.submittedAt));
  const myCleaning = data.cleaning.filter(c => c.driverId === driver.id).sort((a, b) => b.submittedAt.localeCompare(a.submittedAt));
  const myIncidents = data.incidents.filter(i => i.driverId === driver.id).sort((a, b) => b.submittedAt.localeCompare(a.submittedAt));

  const TABS = [['inspections', 'Inspections'], ['fuel', 'Fuel'], ['cleaning', 'Cleaning'], ['incidents', 'Incidents']];

  return (
    <div className="min-h-screen" style={{ background: BG }}>
      <TopBar title="My History" onBack={onBack} />
      <div className="px-4 pt-3 max-w-md mx-auto">
        <div className="flex gap-1 rounded-lg p-1 mb-4" style={{ background: CARD }}>
          {TABS.map(([id, label]) => (
            <button key={id} onClick={() => setTab(id)} className="flex-1 py-2 rounded-md text-xs font-medium" style={tab === id ? { background: STEEL, color: '#fff' } : { color: TEXT_FAINT }}>{label}</button>
          ))}

        {tab === 'inspections' && <HistList empty="No inspections yet." items={myInspections} render={i => (
          <><div className="text-sm font-medium" style={{ color: TEXT }}>{fmtDateTime(i.submittedAt)}</div><div className="text-xs mt-0.5" style={{ color: TEXT_DIM }}>Odometer: {i.odometer || '—'} km</div></>
        )} right={i => <Badge tone={i.outcome === 'pass' ? 'good' : 'bad'}>{i.outcome === 'pass' ? 'Pass' : `${i.flaggedCount} flagged`}</Badge>} />}

        {tab === 'fuel' && <HistList empty="No fuel logs yet." items={myFuel} render={f => (
          <><div className="text-sm font-medium" style={{ color: TEXT }}>{fmtDateTime(f.submittedAt)}</div><div className="text-xs mt-0.5" style={{ color: TEXT_DIM }}>{f.liters} L @ {fmtR(f.pricePerLiter)}/L</div></>
        )} right={f => <span className="font-mono text-sm font-semibold" style={{ color: TEXT }}>{fmtR(f.total)}</span>} />}

        {tab === 'cleaning' && <HistList empty="No cleaning logs yet." items={myCleaning} render={c => (
          <><div className="text-sm font-medium" style={{ color: TEXT }}>{fmtDateTime(c.submittedAt)}</div><div className="text-xs mt-0.5" style={{ color: TEXT_DIM }}>{[c.exteriorWashed && 'Exterior', c.windowsWiped && 'Windows', c.fullClean && 'Full clean'].filter(Boolean).join(', ') || 'No items ticked'}</div></>
        )} right={c => c.fullClean ? <Badge tone="good">Full clean</Badge> : <Badge tone="neutral">Partial</Badge>} />}

        {tab === 'incidents' && <HistList empty="No incidents reported." items={myIncidents} render={i => (
          <><div className="text-sm font-medium" style={{ color: TEXT }}>{fmtDateTime(i.submittedAt)}</div><div className="text-xs mt-0.5" style={{ color: TEXT_DIM }}>{i.type}</div></>
        )} right={i => <Badge tone={i.causedBy === 'driver' ? 'warn' : 'neutral'}>{i.causedBy === 'driver' ? 'Self' : 'Other party'}</Badge>} />}
      </div>
    </div>
  );
}
function HistList({ items, render, right, empty }) {
  return (
    <div className="space-y-2 pb-8">
      {items.length === 0 && <div className="text-center text-sm py-10" style={{ color: TEXT_FAINT }}>{empty}</div>}
      {items.map((item, i) => (
        <div key={item.id || i} className="rounded-xl p-3.5 flex items-center justify-between border" style={{ background: CARD, borderColor: BORDER }}>
          <div>{render(item)}</div>
          {right(item)}
        </div>
      ))}
    </div>
  );
}

/* =========================================================================
   ADMIN APP
========================================================================= */
function AdminApp({ data, persist, onExit }) {
  const [tab, setTab] = useState('dashboard');
  const [modal, setModal] = useState(null);
  const currentWeek = isoWeekStart();

  const weekPayments = useMemo(() => {
    return data.vehicles.filter(v => v.status !== 'retired').map(v => {
      const existing = data.payments.find(p => p.vehicleId === v.id && p.weekStarting === currentWeek);
      return existing || { id: null, vehicleId: v.id, weekStarting: currentWeek, amountDue: v.weeklyFee || WEEKLY_FEE_DEFAULT, amountPaid: 0, status: 'pending' };
    });
  }, [data.vehicles, data.payments, currentWeek]);

  function markPaid(vehicleId) {
    persist(prev => {
      const idx = prev.payments.findIndex(p => p.vehicleId === vehicleId && p.weekStarting === currentWeek);
      const vehicle = prev.vehicles.find(v => v.id === vehicleId);
      const amount = vehicle?.weeklyFee || WEEKLY_FEE_DEFAULT;
      const payments = [...prev.payments];
      if (idx >= 0) payments[idx] = { ...payments[idx], amountPaid: amount, status: 'paid', datePaid: today() };
      else payments.push({ id: uid('pay'), vehicleId, weekStarting: currentWeek, amountDue: amount, amountPaid: amount, status: 'paid', datePaid: today() });
      return { ...prev, payments };
    });
  }
  function markUnpaid(vehicleId) {
    persist(prev => ({ ...prev, payments: prev.payments.map(p => (p.vehicleId === vehicleId && p.weekStarting === currentWeek) ? { ...p, amountPaid: 0, status: 'pending', datePaid: null } : p) }));
  }

  function saveVehicle(v) { persist(prev => ({ ...prev, vehicles: prev.vehicles.some(x => x.id === v.id) ? prev.vehicles.map(x => x.id === v.id ? v : x) : [...prev.vehicles, v] })); setModal(null); }
  function deleteVehicle(id) { if (confirm('Remove this vehicle?')) persist(prev => ({ ...prev, vehicles: prev.vehicles.filter(v => v.id !== id) })); }
  function saveDriver(d) { persist(prev => ({ ...prev, drivers: prev.drivers.some(x => x.id === d.id) ? prev.drivers.map(x => x.id === d.id ? d : x) : [...prev.drivers, d] })); setModal(null); }
  function deleteDriver(id) { if (confirm('Remove this driver account?')) persist(prev => ({ ...prev, drivers: prev.drivers.filter(d => d.id !== id) })); }
  function saveMaintenance(m) { persist(prev => ({ ...prev, maintenance: prev.maintenance.some(x => x.id === m.id) ? prev.maintenance.map(x => x.id === m.id ? m : x) : [...prev.maintenance, m] })); setModal(null); }
  function deleteMaintenance(id) { persist(prev => ({ ...prev, maintenance: prev.maintenance.filter(m => m.id !== id) })); }

  const TABS = [
    { id: 'dashboard', label: 'Dashboard', icon: LayoutGrid },
    { id: 'fleet', label: 'Fleet', icon: Truck },
    { id: 'drivers', label: 'Drivers', icon: Users },
    { id: 'payments', label: 'Weekly Fees', icon: Wallet },
    { id: 'incidents', label: 'Incidents', icon: FileWarning },
    { id: 'cleaning', label: 'Cleaning', icon: Sparkles },
    { id: 'maintenance', label: 'Maintenance', icon: Wrench },
  ];

  return (
    <div className="min-h-screen" style={{ background: BG, fontFamily: "'IBM Plex Sans', system-ui, sans-serif" }}>
      <style>{globalFontStyle}</style>
      <header className="border-b sticky top-0 z-20" style={{ background: CARD_ALT, borderColor: BORDER }}>
        <div className="max-w-6xl mx-auto px-5 py-3.5 flex items-center justify-between">
          <img src={`data:image/png;base64,${LOGO_COMPACT_B64}`} alt="Urban Fleet X" className="h-6" />
          <div className="flex items-center gap-4">
            <button onClick={() => exportAllToExcel(data)} className="flex items-center gap-1.5 text-xs font-mono px-3 py-1.5 rounded border transition" style={{ borderColor: BORDER, color: TEXT_DIM }}>
              <Download size={13} /> Export All
            </button>
            <button onClick={onExit} className="flex items-center gap-1.5 text-sm" style={{ color: TEXT_FAINT }}><LogOut size={15} /> Exit</button>
          </div>
        </div>
        <nav className="max-w-6xl mx-auto px-5 flex gap-1 overflow-x-auto">
          {TABS.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)} className="flex items-center gap-2 px-3.5 py-2.5 text-sm font-medium border-b-2 whitespace-nowrap"
              style={tab === t.id ? { borderColor: SIGNAL, color: TEXT } : { borderColor: 'transparent', color: TEXT_FAINT }}>
              <t.icon size={14} /> {t.label}
            </button>
          ))}
        </nav>
      </header>

      <main className="max-w-6xl mx-auto px-5 py-6">
        {tab === 'dashboard' && <AdminDashboard data={data} weekPayments={weekPayments} currentWeek={currentWeek} />}
        {tab === 'fleet' && <AdminFleet data={data} onAdd={() => setModal({ type: 'vehicle', editing: null })} onEdit={v => setModal({ type: 'vehicle', editing: v })} onDelete={deleteVehicle} />}
        {tab === 'drivers' && <AdminDrivers data={data} onAdd={() => setModal({ type: 'driver', editing: null })} onEdit={d => setModal({ type: 'driver', editing: d })} onDelete={deleteDriver} />}
        {tab === 'payments' && <AdminPayments data={data} weekPayments={weekPayments} currentWeek={currentWeek} onMarkPaid={markPaid} onMarkUnpaid={markUnpaid} />}
        {tab === 'incidents' && <AdminIncidents data={data} />}
        {tab === 'cleaning' && <AdminCleaning data={data} />}
        {tab === 'maintenance' && <AdminMaintenance data={data} onAdd={() => setModal({ type: 'maintenance', editing: null })} onDelete={deleteMaintenance} />}
      </main>

      {modal?.type === 'vehicle' && <VehicleModal vehicle={modal.editing} drivers={data.drivers} onSave={saveVehicle} onClose={() => setModal(null)} />}
      {modal?.type === 'driver' && <DriverModal driver={modal.editing} vehicles={data.vehicles} onSave={saveDriver} onClose={() => setModal(null)} />}
      {modal?.type === 'maintenance' && <MaintenanceModal vehicles={data.vehicles} onSave={saveMaintenance} onClose={() => setModal(null)} />}
    </div>
  );
}

function AdminDashboard({ data, weekPayments, currentWeek }) {
  const activeVehicles = data.vehicles.filter(v => v.status !== 'retired');
  const paidThisWeek = weekPayments.filter(p => p.status === 'paid').length;
  const expectedThisWeek = activeVehicles.reduce((s, v) => s + (v.weeklyFee || WEEKLY_FEE_DEFAULT), 0);
  const collectedThisWeek = weekPayments.reduce((s, p) => s + (p.amountPaid || 0), 0);

  const vehicleInspectionStatus = useMemo(() => data.vehicles.map(v => {
    const inspections = data.inspections.filter(i => i.vehicleId === v.id).sort((a, b) => b.submittedAt.localeCompare(a.submittedAt));
    const latest = inspections[0];
    const openFlags = latest && latest.outcome === 'flagged' ? Object.entries(latest.answers).filter(([, val]) => val === 'flag').map(([key]) => {
      for (const sec of CHECKLIST_SECTIONS) { const idx = sec.items.findIndex((_, i) => sec.key + '_' + i === key); if (idx >= 0) return { label: sec.items[idx], note: latest.notes[key] }; }
      return { label: key, note: latest.notes[key] };
    }) : [];
    return { vehicle: v, latest, openFlags, daysSince: latest ? daysSince(latest.submittedAt) : null };
  }), [data]);

  const flaggedVehicles = vehicleInspectionStatus.filter(v => v.openFlags.length > 0);
  const staleVehicles = vehicleInspectionStatus.filter(v => v.daysSince === null || v.daysSince > 7);
  const recentIncidents = [...data.incidents].sort((a, b) => b.submittedAt.localeCompare(a.submittedAt)).slice(0, 5);
  const cleaningOverdue = data.vehicles.filter(v => {
    const logs = data.cleaning.filter(c => c.vehicleId === v.id && c.fullClean).sort((a, b) => b.submittedAt.localeCompare(a.submittedAt));
    const last = logs[0]?.date;
    return !last || daysSince(last) >= CLEAN_INTERVAL_DAYS;
  });

  const revenueHistory = useMemo(() => {
    const weeks = [];
    for (let i = 7; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i * 7);
      const ws = isoWeekStart(d);
      const total = data.payments.filter(p => p.weekStarting === ws).reduce((s, p) => s + (p.amountPaid || 0), 0);
      weeks.push({ week: ws.slice(5), collected: total });
    }
    return weeks;
  }, [data.payments]);

  return (
    <div className="space-y-6">
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
        <StatCard label="Fleet Size" value={activeVehicles.length} icon={Truck} />
        <StatCard label="Flagged Vehicles" value={flaggedVehicles.length} tone={flaggedVehicles.length > 0 ? 'bad' : 'good'} icon={AlertTriangle} />
        <StatCard label="Cleaning Overdue" value={cleaningOverdue.length} tone={cleaningOverdue.length > 0 ? 'warn' : 'good'} icon={Sparkles} />
        <StatCard label="Collected This Week" value={fmtR(collectedThisWeek)} sub={`of ${fmtR(expectedThisWeek)} expected`} icon={Wallet} tone={collectedThisWeek < expectedThisWeek ? 'warn' : undefined} />
      </div>

      {flaggedVehicles.length > 0 && (
        <div className="rounded-xl overflow-hidden border" style={{ background: CARD, borderColor: BORDER }}>
          <div className="px-5 py-3.5 border-b flex items-center gap-2" style={{ borderColor: BORDER }}><AlertTriangle size={15} className="text-red-400" /><span className="text-sm font-semibold" style={{ color: TEXT }}>Vehicles With Open Inspection Issues</span></div>
          <div className="divide-y" style={{ borderColor: BORDER }}>
            {flaggedVehicles.map(({ vehicle, openFlags, latest }) => (
              <div key={vehicle.id} className="px-5 py-4">
                <div className="flex items-center justify-between mb-2"><span className="font-mono font-semibold text-sm" style={{ color: TEXT }}>{vehicle.plate}</span><span className="text-xs" style={{ color: TEXT_FAINT }}>{fmtDateTime(latest.submittedAt)}</span></div>
                <div className="flex flex-wrap gap-1.5">{openFlags.map((f, i) => <Badge key={i} tone="bad">{f.label}{f.note ? `: ${f.note}` : ''}</Badge>)}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {recentIncidents.length > 0 && (
        <div className="rounded-xl overflow-hidden border" style={{ background: CARD, borderColor: BORDER }}>
          <div className="px-5 py-3.5 border-b flex items-center gap-2" style={{ borderColor: BORDER }}><FileWarning size={15} className="text-red-400" /><span className="text-sm font-semibold" style={{ color: TEXT }}>Recent Incidents &amp; Damage</span></div>
          <div className="divide-y" style={{ borderColor: BORDER }}>
            {recentIncidents.map(i => {
              const vehicle = data.vehicles.find(v => v.id === i.vehicleId);
              return (
                <div key={i.id} className="px-5 py-3.5 flex items-center justify-between text-sm">
                  <div><span className="font-mono font-medium" style={{ color: TEXT }}>{vehicle?.plate}</span> <span style={{ color: TEXT_DIM }}>— {i.type}</span></div>
                  <Badge tone={i.causedBy === 'driver' ? 'warn' : 'neutral'}>{i.causedBy === 'driver' ? 'Caused by driver' : 'Caused by other party'}</Badge>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div className="rounded-xl p-5 border" style={{ background: CARD, borderColor: BORDER }}>
        <div className="flex items-center gap-2 mb-4"><TrendingUp size={15} style={{ color: TEXT_FAINT }} /><span className="text-sm font-semibold" style={{ color: TEXT }}>Weekly Fee Collection — Last 8 Weeks</span></div>
        <ResponsiveContainer width="100%" height={220}>
          <BarChart data={revenueHistory}>
            <CartesianGrid strokeDasharray="3 3" stroke={BORDER} vertical={false} />
            <XAxis dataKey="week" tick={{ fontSize: 11, fontFamily: 'IBM Plex Mono', fill: TEXT_FAINT }} stroke={BORDER} />
            <YAxis tick={{ fontSize: 11, fontFamily: 'IBM Plex Mono', fill: TEXT_FAINT }} stroke={BORDER} tickFormatter={v => `R${v / 1000}k`} />
            <Tooltip formatter={v => fmtR(v)} contentStyle={{ fontSize: 12, fontFamily: 'IBM Plex Mono', background: CARD_ALT, border: `1px solid ${BORDER}`, color: TEXT }} />
            <Bar dataKey="collected" fill={STEEL} radius={[3, 3, 0, 0]} />
          </BarChart>
        </ResponsiveContainer>
      </div>
    </div>
  );
}

function TableShell({ title, action, headers, children }) {
  return (
    <div className="space-y-4">
      <div className="flex justify-between items-center">
        <h2 className="font-display font-semibold text-lg" style={{ color: TEXT }}>{title}</h2>
        {action}
      </div>
      <div className="rounded-xl overflow-hidden overflow-x-auto border" style={{ background: CARD, borderColor: BORDER }}>
        <table className="w-full text-sm">
          <thead className="text-xs font-mono uppercase" style={{ background: CARD_ALT, color: TEXT_FAINT }}>
            <tr>{headers.map(h => <th key={h} className="text-left px-4 py-3">{h}</th>)}</tr>
          </thead>
          <tbody className="divide-y" style={{ borderColor: BORDER }}>{children}</tbody>
        </table>
      </div>
    </div>
  );
}
function AddBtn({ onClick, label }) {
  return <button onClick={onClick} className="inline-flex items-center gap-2 px-3 py-2 rounded text-sm font-medium text-white" style={{ background: STEEL }}><Plus size={15} /> {label}</button>;
}

function AdminPayments({ data, weekPayments, currentWeek, onMarkPaid, onMarkUnpaid }) {

        <div className="flex items-center gap-3">
          <span className="text-xs font-mono" style={{ color: TEXT_FAINT }}>Week of {currentWeek}</span>
          <button onClick={() => exportWeekToExcel(weekPayments, data.vehicles, data.drivers, currentWeek)} className="flex items-center gap-1.5 text-xs font-mono px-3 py-1.5 rounded border" style={{ borderColor: BORDER, color: TEXT_DIM }}><Download size={13} /> Export Week</button>
        </div>
      </div>
      <div className="rounded-md px-4 py-3 text-xs flex items-start gap-2 border" style={{ background: 'rgba(245,158,11,0.08)', borderColor: 'rgba(245,158,11,0.3)', color: '#FCD34D' }}>
        <ShieldCheck size={15} className="mt-0.5 flex-shrink-0" />
        <span>Per the Driver Agreement, an unpaid weekly fee is a strict, standalone breach — no grace period.</span>
      </div>
      <div className="rounded-xl overflow-hidden overflow-x-auto border" style={{ background: CARD, borderColor: BORDER }}>
        <table className="w-full text-sm">
          <thead className="text-xs font-mono uppercase" style={{ background: CARD_ALT, color: TEXT_FAINT }}><tr><th className="text-left px-4 py-3">Vehicle</th><th className="text-left px-4 py-3">Driver</th><th className="text-left px-4 py-3">Amount Due</th><th className="text-left px-4 py-3">Status</th><th className="text-right px-4 py-3">Action</th></tr></thead>

              const vehicle = data.vehicles.find(v => v.id === p.vehicleId);
              const driver = data.drivers.find(d => d.id === vehicle?.driverId);
              return (
                <tr key={p.vehicleId}>
                  <td className="px-4 py-3 font-mono font-medium" style={{ color: TEXT }}>{vehicle?.plate}</td>
                  <td className="px-4 py-3" style={{ color: TEXT_DIM }}>{driver ? driver.name : <span style={{ color: TEXT_FAINT }}>Unassigned</span>}</td>
                  <td className="px-4 py-3 font-mono" style={{ color: TEXT_DIM }}>{fmtR(p.amountDue)}</td>

                    {p.status === 'paid' ? <button onClick={() => onMarkUnpaid(p.vehicleId)} className="text-xs font-mono" style={{ color: TEXT_FAINT }}>Undo</button>
                      : <button onClick={() => onMarkPaid(p.vehicleId)} className="text-xs font-mono px-3 py-1.5 rounded text-white" style={{ background: STEEL }}>Mark Paid</button>}

                </tr>

            {weekPayments.length === 0 && <tr><td colSpan={5} className="px-4 py-8 text-center text-sm" style={{ color: TEXT_FAINT }}>Add vehicles first.</td></tr>}

}

function AdminIncidents({ data }) {
  const rows = [...data.incidents].sort((a, b) => b.submittedAt.localeCompare(a.submittedAt));
  const [expanded, setExpanded] = useState(null);
  return (
    <div className="space-y-4">
      <h2 className="font-display font-semibold text-lg" style={{ color: TEXT }}>Incidents, Accidents &amp; Damage</h2>
      {rows.length === 0 && <div className="rounded-xl p-8 text-center text-sm border" style={{ background: CARD, borderColor: BORDER, color: TEXT_FAINT }}>No incidents reported.</div>}
      <div className="space-y-3">
        {rows.map(i => {
          const vehicle = data.vehicles.find(v => v.id === i.vehicleId);
          const driver = data.drivers.find(d => d.id === i.driverId);
          const isOpen = expanded === i.id;
          return (
            <div key={i.id} className="rounded-xl border overflow-hidden" style={{ background: CARD, borderColor: BORDER }}>
              <button onClick={() => setExpanded(isOpen ? null : i.id)} className="w-full flex items-center justify-between px-5 py-4 text-left">
                <div className="flex items-center gap-3">
                  <FileWarning size={16} className="text-red-400" />
                  <div>
                    <div className="text-sm font-medium" style={{ color: TEXT }}>{vehicle?.plate} — {i.type}</div>
                    <div className="text-xs mt-0.5" style={{ color: TEXT_FAINT }}>{fmtDateTime(i.submittedAt)} · Reported by {driver?.name || '—'}</div>
                  </div>
                </div>
                <Badge tone={i.causedBy === 'driver' ? 'warn' : 'neutral'}>{i.causedBy === 'driver' ? 'Caused by driver' : 'Caused by other party'}</Badge>
              </button>
              {isOpen && (
                <div className="px-5 pb-5 pt-1 border-t space-y-3" style={{ borderColor: BORDER }}>
                  <div><div className="text-xs font-mono uppercase tracking-wide mb-1" style={{ color: TEXT_FAINT }}>Description</div><div className="text-sm" style={{ color: TEXT_DIM }}>{i.description}</div></div>
                  {i.policeCaseNumber && <div><div className="text-xs font-mono uppercase tracking-wide mb-1" style={{ color: TEXT_FAINT }}>Police Case No.</div><div className="text-sm font-mono" style={{ color: TEXT_DIM }}>{i.policeCaseNumber}</div></div>}
                  {i.causedBy === 'other' && i.otherParty && (
                    <div className="rounded-lg p-4 border" style={{ background: CARD_ALT, borderColor: BORDER }}>
                      <div className="text-xs font-mono uppercase tracking-wide mb-2" style={{ color: TEXT_FAINT }}>Other Party's Details</div>
                      <div className="grid grid-cols-2 gap-x-4 gap-y-1.5 text-sm">
                        <div style={{ color: TEXT_DIM }}>Name: <span style={{ color: TEXT }}>{i.otherParty.name || '—'}</span></div>
                        <div style={{ color: TEXT_DIM }}>ID Number: <span style={{ color: TEXT }}>{i.otherParty.idNumber || '—'}</span></div>
                        <div style={{ color: TEXT_DIM }}>Phone: <span style={{ color: TEXT }}>{i.otherParty.phone || '—'}</span></div>
                        <div style={{ color: TEXT_DIM }}>Vehicle Reg: <span style={{ color: TEXT }}>{i.otherParty.vehicleReg || '—'}</span></div>
                        <div className="col-span-2" style={{ color: TEXT_DIM }}>Address: <span style={{ color: TEXT }}>{i.otherParty.address || '—'}</span></div>
                        <div className="col-span-2" style={{ color: TEXT_DIM }}>Insurer: <span style={{ color: TEXT }}>{i.otherParty.insurer || '—'}</span></div>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function AdminCleaning({ data }) {
  const statuses = data.vehicles.map(v => {
    const logs = data.cleaning.filter(c => c.vehicleId === v.id).sort((a, b) => b.submittedAt.localeCompare(a.submittedAt));
    const lastFull = logs.find(c => c.fullClean);
    const ds = lastFull ? daysSince(lastFull.date) : null;
    return { vehicle: v, lastLog: logs[0], lastFull, overdue: ds === null || ds >= CLEAN_INTERVAL_DAYS };
  });
  return (
    <TableShell title="Cleaning Compliance" headers={['Vehicle', 'Last Cleaning Activity', 'Last Full Clean', 'Status']}>
      {statuses.map(({ vehicle, lastLog, lastFull, overdue }) => (
        <tr key={vehicle.id}>
          <td className="px-4 py-3 font-mono font-medium" style={{ color: TEXT }}>{vehicle.plate}</td>
          <td className="px-4 py-3 text-xs" style={{ color: TEXT_DIM }}>{lastLog ? fmtDateTime(lastLog.submittedAt) : '—'}</td>
          <td className="px-4 py-3 text-xs" style={{ color: TEXT_DIM }}>{lastFull ? lastFull.date : 'Never'}</td>
          <td className="px-4 py-3"><Badge tone={overdue ? 'warn' : 'good'}>{overdue ? 'Overdue' : 'Up to date'}</Badge></td>
        </tr>
      ))}
      {statuses.length === 0 && <tr><td colSpan={4} className="px-4 py-8 text-center text-sm" style={{ color: TEXT_FAINT }}>No vehicles added yet.</td></tr>}
    </TableShell>
  );
}

function AdminMaintenance({ data, onAdd, onDelete }) {
  return (
    <TableShell title="Maintenance Log" action={<AddBtn onClick={onAdd} label="Log Maintenance" />} headers={['Vehicle', 'Date', 'Type', 'Cost', 'Notes', '']}>
      {[...data.maintenance].sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(m => {
        const vehicle = data.vehicles.find(v => v.id === m.vehicleId);
        return (
          <tr key={m.id}>
            <td className="px-4 py-3 font-mono font-medium" style={{ color: TEXT }}>{vehicle?.plate || '—'}</td>
            <td className="px-4 py-3 font-mono text-xs" style={{ color: TEXT_FAINT }}>{m.date}</td>
            <td className="px-4 py-3" style={{ color: TEXT_DIM }}>{m.type}</td>
            <td className="px-4 py-3 font-mono" style={{ color: TEXT_DIM }}>{fmtR(m.cost)}</td>
            <td className="px-4 py-3 text-xs max-w-xs truncate" style={{ color: TEXT_FAINT }}>{m.notes}</td>
            <td className="px-4 py-3 text-right"><button onClick={() => onDelete(m.id)} className="text-red-400/70 hover:text-red-400"><Trash2 size={14} /></button></td>
          </tr>
        );
      })}
      {data.maintenance.length === 0 && <tr><td colSpan={6} className="px-4 py-8 text-center text-sm" style={{ color: TEXT_FAINT }}>No maintenance logged yet.</td></tr>}
    </TableShell>
  );
}

function VehicleModal({ vehicle, drivers, onSave, onClose }) {
  const [f, setF] = useState(vehicle || { id: uid('veh'), plate: '', model: '', driverId: '', status: 'active', weeklyFee: WEEKLY_FEE_DEFAULT, insuranceExpiry: '', licenseExpiry: '', nextInspection: '' });
  return (
    <Modal title={vehicle ? 'Edit Vehicle' : 'Add Vehicle'} onClose={onClose}>
      <Field label="Registration Plate"><input className={inputCls} style={inputStyle} value={f.plate} onChange={e => setF({ ...f, plate: e.target.value })} placeholder="e.g. CA 123-456" /></Field>
      <Field label="Make / Model"><input className={inputCls} style={inputStyle} value={f.model} onChange={e => setF({ ...f, model: e.target.value })} placeholder="e.g. Toyota Corolla Quest" /></Field>
      <Field label="Assigned Driver">
        <select className={inputCls} style={inputStyle} value={f.driverId} onChange={e => setF({ ...f, driverId: e.target.value })}>
          <option value="">Unassigned</option>
          {drivers.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
        </select>
      </Field>
      <Field label="Status">
        <select className={inputCls} style={inputStyle} value={f.status} onChange={e => setF({ ...f, status: e.target.value })}>
          <option value="active">Active</option><option value="maintenance">In Maintenance</option><option value="available">Available (No Driver)</option><option value="retired">Retired</option>
        </select>
      </Field>
      <Field label="Weekly Fee (R)"><input type="number" className={inputCls} style={inputStyle} value={f.weeklyFee} onChange={e => setF({ ...f, weeklyFee: Number(e.target.value) })} /></Field>
      <Field label="Insurance Expiry"><input type="date" className={inputCls} style={inputStyle} value={f.insuranceExpiry} onChange={e => setF({ ...f, insuranceExpiry: e.target.value })} /></Field>
      <Field label="Vehicle Licence Expiry"><input type="date" className={inputCls} style={inputStyle} value={f.licenseExpiry} onChange={e => setF({ ...f, licenseExpiry: e.target.value })} /></Field>
      <Field label="Next Inspection Due"><input type="date" className={inputCls} style={inputStyle} value={f.nextInspection} onChange={e => setF({ ...f, nextInspection: e.target.value })} /></Field>
      <div className="flex justify-end gap-2 mt-4">
        <button onClick={onClose} className="px-4 py-2 text-sm" style={{ color: TEXT_FAINT }}>Cancel</button>
        <button onClick={() => onSave(f)} disabled={!f.plate} className="px-4 py-2 text-sm text-white rounded disabled:opacity-40" style={{ background: STEEL }}>Save Vehicle</button>
      </div>
    </Modal>
  );
}

function DriverModal({ driver, vehicles, onSave, onClose }) {
  const [f, setF] = useState(driver || { id: uid('drv'), name: '', username: '', pin: '', phone: '', vehicleId: '', prdpExpiry: '', agreementStart: '', status: 'active' });

  function genPin() {
    setF({ ...f, pin: String(Math.floor(1000 + Math.random() * 9000)) });
  }

  return (
    <Modal title={driver ? 'Edit Driver' : 'Create Driver Login'} onClose={onClose}>
      <Field label="Full Name"><input className={inputCls} style={inputStyle} value={f.name} onChange={e => setF({ ...f, name: e.target.value })} /></Field>
      <Field label="Phone"><input className={inputCls} style={inputStyle} value={f.phone} onChange={e => setF({ ...f, phone: e.target.value })} placeholder="e.g. 082 123 4567" /></Field>

      <div className="rounded-lg p-3.5 border mb-3" style={{ background: CARD_ALT, borderColor: BORDER }}>
        <div className="flex items-center gap-2 mb-2.5"><KeyRound size={14} color={SIGNAL} /><span className="text-xs font-mono uppercase tracking-wide" style={{ color: TEXT_DIM }}>Driver Login PIN</span></div>
        <div className="flex gap-2">
          <input className={inputCls + ' font-mono'} style={inputStyle} value={f.pin} onChange={e => setF({ ...f, pin: e.target.value })} placeholder="4-digit PIN" maxLength={6} />

        </div>
        <p className="text-[11px] mt-2" style={{ color: TEXT_FAINT }}>The driver uses their name + this PIN to log in. Leave blank to allow login without a PIN.</p>
      </div>

      <Field label="Assign Vehicle">
        <select className={inputCls} style={inputStyle} value={f.vehicleId} onChange={e => setF({ ...f, vehicleId: e.target.value })}>
          <option value="">None</option>
          {vehicles.map(v => <option key={v.id} value={v.id}>{v.plate} — {v.model}</option>)}
        </select>
      </Field>
      <Field label="PrDP Expiry"><input type="date" className={inputCls} style={inputStyle} value={f.prdpExpiry} onChange={e => setF({ ...f, prdpExpiry: e.target.value })} /></Field>
      <Field label="Driver Agreement Start Date"><input type="date" className={inputCls} style={inputStyle} value={f.agreementStart} onChange={e => setF({ ...f, agreementStart: e.target.value })} /></Field>
      <Field label="Status">
        <select className={inputCls} style={inputStyle} value={f.status} onChange={e => setF({ ...f, status: e.target.value })}>
          <option value="active">Active</option><option value="inactive">Inactive</option>
        </select>
      </Field>
      <div className="flex justify-end gap-2 mt-4">
        <button onClick={onClose} className="px-4 py-2 text-sm" style={{ color: TEXT_FAINT }}>Cancel</button>
        <button onClick={() => onSave(f)} disabled={!f.name} className="px-4 py-2 text-sm text-white rounded disabled:opacity-40" style={{ background: STEEL }}>Save Driver</button>
      </div>
    </Modal>
  );
}
